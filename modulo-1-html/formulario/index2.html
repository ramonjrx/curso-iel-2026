<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>documentaçao</title>
</head>
<body>
    
    <h1>Exemplos de inputs</h1>

    <form action="">

        <div>
            <label for="text">Texto</label>
            <input placeholder="Insira algo.." type="text" name="text" id="text">
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
        </div>

        <div>
            <label for="password">Senha</label>
            <input type="password" name="" id="password">
        </div>

        <div>
            <label for="checkbox">Checkbox</label>
            <input type="checkbox" name="checkbox" id="checkbox">
        </div>

        <div>
            <label for="date">Data</label>
            <input type="date" name="date" id="date">
        </div>

        <div>
            <label for="date-time">Data e Hora</label>
            <input type="datetime-local" name="data-time" id="data-time">
        </div>

        <div>
            <select name="ASSUNTO" id="">
                <option disabled selected value="">Selecione uma opçao</option>
                <option value="option-01">Opçao 1</option>
                <option value="option-02">Opçao 2</option>
                <option value="option-03">Opçao 3</option>
            </select>
        </div>



    </form>
</body>
</html>
