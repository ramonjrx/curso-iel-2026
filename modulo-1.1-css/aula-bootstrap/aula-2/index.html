<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="bg-primary vw-100 vh-100 d-flex flex-column align-items-center">
        <header class="w-100 h-25 bg-secondary"></header>
        <main class="w-75 h-100 bg-warning d-flex justify-content-center align-items-center">
            <section class="d-flex gap-5 w-75 h-75 bg-secondary justify-content-between align-items-center">
                <div class="d-flex align-items-center justify-content-center h-25 w-25 bg-primary order-3">
                    ONE
                </div>
                <div class="d-flex align-items-center justify-content-center h-25 w-25 bg-primary order-2">
                    TWO
                </div>
                <div class="d-flex align-items-center justify-content-center h-25 w-25 bg-primary order-1">
                    THREE
                </div>
            </section>
        </main>
        <footer class="w-100 h-25 bg-danger"></footer>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
