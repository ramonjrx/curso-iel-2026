<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="d-flex justify-content-center align-items-center vw-100 vh-100 bg-secondary">

        <div class="w-100 h-100 d-flex flex-column justify-content-center align-items-center">

            <div class="row bg-success w-75 h-25">
                <div class="col bg-primary">1</div>
                <div class="col bg-warning">2</div>
                <div class="col-7 bg-danger">3</div>
                <div class="col bg-success">4</div>
            </div>

            <div class="row bg-info w-75 h-25">
                <div class="col bg-success">1</div>
                <div class="col bg-danger">2</div>
                <div class="col bg-warning">3</div>
                <div class="col-6 bg-primary">4</div>
            </div>

            <div class="row row-cols-2 bg-success w-75 h-25">
                <div class="col-9 bg-black">1</div>
                <div class="col-3 bg-info">2</div>
                <div class="col bg-success">3</div>
                <div class="col bg-warning">4</div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
